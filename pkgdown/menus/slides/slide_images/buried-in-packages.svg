<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Cartoon of a person completely buried under paperwork and R package hex stickers, with only a hand and white flag sticking out</title>
  <defs>
    <g id="sheet">
      <rect x="-45" y="-57" width="90" height="115" rx="3" fill="#ffffff" stroke="#9fb0c6" stroke-width="2"/>
      <g stroke="#c9d3e0" stroke-width="3" stroke-linecap="round">
        <line x1="-32" y1="-38" x2="30" y2="-38"/>
        <line x1="-32" y1="-24" x2="22" y2="-24"/>
        <line x1="-32" y1="-10" x2="32" y2="-10"/>
        <line x1="-32" y1="4" x2="14" y2="4"/>
        <line x1="-32" y1="18" x2="28" y2="18"/>
        <line x1="-32" y1="32" x2="8" y2="32"/>
      </g>
    </g>
    <path id="hex" d="M 0 -42 L 36.4 -21 L 36.4 21 L 0 42 L -36.4 21 L -36.4 -21 Z" stroke="#1b2b40" stroke-width="5" stroke-linejoin="round"/>
  </defs>

  <style>
    .hex-label { font-family: "Source Sans Pro", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
    .light { fill: #ffffff; }
    .dark { fill: #1b2b40; }
  </style>

  <ellipse cx="400" cy="548" rx="320" ry="24" fill="#000000" opacity="0.25"/>

  <!-- Flying items -->
  <g opacity="0.9">
    <use xlink:href="#sheet" transform="translate(170 170) rotate(-30) scale(0.6)"/>
    <use xlink:href="#sheet" transform="translate(105 300) rotate(15) scale(0.5)"/>
    <g transform="translate(650 150) rotate(20) scale(0.7)">
      <use xlink:href="#hex" fill="#c5203f"/>
      <text class="hex-label light">v4.0.1</text>
    </g>
  </g>
  <g stroke="#8dc1c5" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="215" y1="205" x2="245" y2="225"/>
    <line x1="205" y1="220" x2="230" y2="238"/>
    <line x1="610" y1="180" x2="585" y2="200"/>
    <line x1="620" y1="195" x2="597" y2="213"/>
  </g>

  <!-- Back of the pile -->
  <use xlink:href="#sheet" transform="translate(360 262) rotate(-15)"/>
  <use xlink:href="#sheet" transform="translate(470 258) rotate(20)"/>
  <use xlink:href="#sheet" transform="translate(300 300) rotate(-30)"/>
  <use xlink:href="#sheet" transform="translate(530 300) rotate(25)"/>

  <!-- Sleeve disappearing into the pile -->
  <line x1="408" y1="275" x2="428" y2="196" stroke="#3c587f" stroke-width="24" stroke-linecap="round"/>

  <!-- Paper pile -->
  <use xlink:href="#sheet" transform="translate(410 272) rotate(6)"/>

  <use xlink:href="#sheet" transform="translate(250 332) rotate(-25)"/>
  <use xlink:href="#sheet" transform="translate(372 328) rotate(-5)"/>
  <use xlink:href="#sheet" transform="translate(492 328) rotate(15)"/>
  <use xlink:href="#sheet" transform="translate(605 345) rotate(-20)"/>

  <use xlink:href="#sheet" transform="translate(180 412) rotate(20)"/>
  <use xlink:href="#sheet" transform="translate(292 406) rotate(-10)"/>
  <use xlink:href="#sheet" transform="translate(352 400) rotate(14)"/>
  <use xlink:href="#sheet" transform="translate(462 404) rotate(-16)"/>
  <use xlink:href="#sheet" transform="translate(578 408) rotate(8)"/>
  <use xlink:href="#sheet" transform="translate(632 420) rotate(24)"/>

  <use xlink:href="#sheet" transform="translate(205 472) rotate(-6)"/>
  <use xlink:href="#sheet" transform="translate(268 466) rotate(12)"/>
  <use xlink:href="#sheet" transform="translate(382 472) rotate(-14)"/>
  <use xlink:href="#sheet" transform="translate(442 464) rotate(5)"/>
  <use xlink:href="#sheet" transform="translate(560 472) rotate(-12)"/>
  <use xlink:href="#sheet" transform="translate(622 470) rotate(18)"/>

  <use xlink:href="#sheet" transform="translate(160 516) rotate(-4)"/>
  <use xlink:href="#sheet" transform="translate(230 512) rotate(10)"/>
  <use xlink:href="#sheet" transform="translate(300 518) rotate(-12)"/>
  <use xlink:href="#sheet" transform="translate(370 512) rotate(6)"/>
  <use xlink:href="#sheet" transform="translate(440 518) rotate(-18)"/>
  <use xlink:href="#sheet" transform="translate(510 512) rotate(9)"/>
  <use xlink:href="#sheet" transform="translate(580 518) rotate(-6)"/>
  <use xlink:href="#sheet" transform="translate(645 512) rotate(14)"/>

  <!-- Package hexes scattered through the pile -->
  <g transform="translate(355 245) rotate(-10)">
    <use xlink:href="#hex" fill="#e8c468"/>
    <text class="hex-label dark">v1.2.0</text>
  </g>
  <g transform="translate(475 248) rotate(12)">
    <use xlink:href="#hex" fill="#8dc1c5"/>
    <text class="hex-label dark">v2.1.3</text>
  </g>
  <g transform="translate(312 316) rotate(8)">
    <use xlink:href="#hex" fill="#c5203f"/>
    <text class="hex-label light">v0.9.2</text>
  </g>
  <g transform="translate(432 330) rotate(-14)">
    <use xlink:href="#hex" fill="#3c587f"/>
    <text class="hex-label light">v2.0.0</text>
  </g>
  <g transform="translate(552 320) rotate(6)">
    <use xlink:href="#hex" fill="#5fd4b5"/>
    <text class="hex-label dark">v1.5.1</text>
  </g>
  <g transform="translate(236 404) rotate(-12)">
    <use xlink:href="#hex" fill="#f4a261"/>
    <text class="hex-label dark">v1.0.0</text>
  </g>
  <g transform="translate(372 418) rotate(4)">
    <use xlink:href="#hex" fill="#e8c468"/>
    <text class="hex-label dark">v3.0.2</text>
  </g>
  <g transform="translate(522 410) rotate(16)">
    <use xlink:href="#hex" fill="#9b8dc5"/>
    <text class="hex-label light">v2.4.1</text>
  </g>
  <g transform="translate(150 480) rotate(-8)">
    <use xlink:href="#hex" fill="#8dc1c5"/>
    <text class="hex-label dark">v0.3.0</text>
  </g>
  <g transform="translate(302 490) rotate(-6)">
    <use xlink:href="#hex" fill="#c5203f"/>
    <text class="hex-label light">v1.7.4</text>
  </g>
  <g transform="translate(470 492) rotate(10)">
    <use xlink:href="#hex" fill="#5fd4b5"/>
    <text class="hex-label dark">v3.2.0</text>
  </g>
  <g transform="translate(630 470) rotate(-14)">
    <use xlink:href="#hex" fill="#3c587f"/>
    <text class="hex-label light">v5.1.2</text>
  </g>
  <g transform="translate(110 530) rotate(12)">
    <use xlink:href="#hex" fill="#e8c468"/>
    <text class="hex-label dark">v1.1.0</text>
  </g>
  <g transform="translate(640 540) rotate(-10)">
    <use xlink:href="#hex" fill="#c5203f"/>
    <text class="hex-label light">v2.8.3</text>
  </g>

  <!-- Hand waving a white flag -->
  <line x1="426" y1="205" x2="442" y2="70" stroke="#6b4f3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 441 74 q 30 -12 58 4 q -6 22 4 40 q -30 -13 -60 0 z" fill="#ffffff" stroke="#9fb0c6" stroke-width="2"/>
  <circle cx="430" cy="186" r="15" fill="#f6c89f" stroke="#3a2a1f" stroke-width="3"/>

  <!-- Coffee mug -->
  <g transform="translate(745 500)">
    <rect x="-24" y="-30" width="48" height="58" rx="6" fill="#c5203f" stroke="#3a2a1f" stroke-width="3"/>
    <path d="M 24 -18 q 22 0 22 18 q 0 18 -22 18" fill="none" stroke="#3a2a1f" stroke-width="5"/>
    <g fill="none" stroke="#eef2f7" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M -8 -40 q -8 -10 0 -20 q 8 -10 0 -20"/>
      <path d="M 8 -40 q -8 -10 0 -20 q 8 -10 0 -20"/>
    </g>
  </g>
</svg>
